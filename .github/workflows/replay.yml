name: edition replay
on: [push, pull_request, workflow_dispatch]
jobs:
  windows-replay:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm run setup
      - run: npm run verify
      - run: npm run browser:install
      - run: npm run browser:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-replay-evidence
          path: artifacts/
  # No account credentials, Codex invocation, or paid/model calls in this workflow.
